name: Sea Glass checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop-android-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: xvfb-run -a ./gradlew :seaglass-compose:desktopTest apiCheck :sample:assembleDebug :sample:wasmJsBrowserDistribution --stacktrace
      - run: ./gradlew :seaglass-compose:publishAllPublicationsToStagingRepository :seaglass-haze:publishAllPublicationsToStagingRepository validateLocalPublication
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-demo
          path: |
            **/build/reports/
            sample/build/dist/wasmJs/productionExecutable/
            sample/build/outputs/apk/debug/
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :sample:compileKotlinIosX64 :sample:compileKotlinIosArm64 :sample:compileKotlinIosSimulatorArm64 :sample:linkDebugFrameworkIosSimulatorArm64
      - run: ./gradlew :seaglass-compose:publishAllPublicationsToStagingRepository :seaglass-haze:publishAllPublicationsToStagingRepository validateLocalPublication
