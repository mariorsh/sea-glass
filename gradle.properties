org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
GROUP=io.github.mariorsh.seaglass
VERSION_NAME=0.3.0-alpha01
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9's built-in Kotlin/new DSL reject the legacy com.android.library/application +
# org.jetbrains.kotlin.multiplatform combination; these keep the current module layout
# for this platform-only release. Migrating to com.android.kotlin.multiplatform.library is
# a separate, larger change (DSL and source-set rewrite) tracked as follow-up, not done here.
android.builtInKotlin=false
android.newDsl=false
# Las tareas de iOS solo se ejecutan en macOS; en Linux/Windows se omiten sin error.
kotlin.native.ignoreDisabledTargets=true

# Licencia publicada en el POM (requerida por Maven Central)
releaseLicenseName=The Apache License, Version 2.0
releaseLicenseUrl=https://www.apache.org/licenses/LICENSE-2.0.txt
