name: SeaGlassSampleApp
options:
  bundleIdPrefix: io.github.mariorsh.seaglass
  deploymentTarget:
    iOS: "16.0"
targets:
  SeaGlassSampleApp:
    type: application
    platform: iOS
    sources: [SeaGlassView.swift, App.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mariorsh.seaglass.sample.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "-framework SeaGlassSample"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          JDK17=$(ls -d "$HOME"/.gradle/jdks/eclipse_adoptium-17-*/*/Contents/Home 2>/dev/null | head -1)
          if [ -n "$JDK17" ]; then export JAVA_HOME="$JDK17"; fi
          ./gradlew :sample:embedAndSignAppleFrameworkForXcode
